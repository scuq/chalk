<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:"
    />
    <title>chalk</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <main id="server" hidden>
      <h1>chalk</h1>
      <p class="lede">Which server?</p>
      <p id="error" class="error" hidden></p>
      <ul id="servers" class="servers"></ul>
      <form id="form" class="row">
        <input id="url" type="text" autocomplete="off" spellcheck="false" placeholder="chat.example.org" />
        <button type="submit">Connect</button>
      </form>
      <p class="hint">Only https servers, except a local dev stack on 127.0.0.1.</p>
    </main>

    <main id="share" hidden>
      <h1>Share your screen</h1>
      <p class="lede">Pick a screen or a window.</p>
      <div id="sources" class="sources"></div>
      <div class="row end">
        <button id="cancel" type="button">Cancel</button>
      </div>
    </main>

    <script src="picker.js"></script>
  </body>
</html>
