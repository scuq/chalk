<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Chalk logo</title>
  <desc id="desc">Green chalk stick inside a rounded speech bubble on a near-black background.</desc>

  <!--
    Master artwork for the chalk mark. Full detail, meant for large
    renderings (docs, share images, print). The two derivatives are:
      - icons/favicon.svg      -- same mark, fine detail and glow removed
      - src/components/Logo.tsx -- same mark, inline, theme-aware notch
    Change this file first, then port the change to both.
  -->

  <defs>
    <linearGradient id="green" x1="70" y1="40" x2="330" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56f09a"/>
      <stop offset="0.48" stop-color="#35df83"/>
      <stop offset="1" stop-color="#20ce70"/>
    </linearGradient>

    <filter id="outerGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.10
                0 0 0 0 0.95
                0 0 0 0 0.45
                0 0 0 0.72 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#080b0d"/>

  <!-- Speech bubble -->
  <path
    d="M111 42
       H291
       C329 42 354 68 354 106
       V267
       C354 305 329 329 291 329
       H178
       L106 376
       V329
       C69 327 47 303 47 267
       V106
       C47 68 73 42 111 42
       Z"
    fill="none"
    stroke="url(#green)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#outerGlow)"/>

  <!-- Main chalk stick -->
  <path
    d="M122.5 211.5
       L228.5 105.5
       C236.5 97.5 247.5 98.0 255.5 105.0
       L269.0 116.5
       C277.0 123.5 277.5 134.0 270.0 141.5
       L158.5 253.0
       Z"
    fill="url(#green)"
    filter="url(#smallGlow)"/>

  <!-- Dark separator -->
  <path
    d="M119.5 214.5
       L158.0 253.0
       L151.5 259.5
       L113.0 221.0
       Z"
    fill="#080b0d"/>

  <!-- Rounded chalk end -->
  <path
    d="M112.5 222.5
       L150.5 260.5
       L142.5 268.5
       C130.0 281.0 112.0 283.0 101.5 272.5
       C91.0 262.0 93.0 244.0 105.5 231.5
       Z"
    fill="url(#green)"
    filter="url(#smallGlow)"/>

  <!-- Chalk scribble -->
  <g fill="none" stroke="url(#green)" stroke-linecap="round" stroke-linejoin="round" filter="url(#smallGlow)">
    <path d="M157 275
             C163 272 168 278 173 274
             C178 271 183 278 189 274
             C195 271 199 276 205 273
             C211 270 217 276 223 273
             C230 270 236 275 242 272
             C250 269 257 275 264 272
             C272 269 280 274 287 271
             C295 268 303 273 311 270"
          stroke-width="4.8"/>
    <path d="M164 279
             C175 276 183 281 194 277
             C206 273 216 280 228 276
             C240 272 252 279 264 275
             C278 271 292 277 307 273"
          stroke-width="2.2" opacity="0.85"/>
    <path d="M184 270 L201 277 M216 269 L231 276 M249 269 L263 275 M281 268 L297 273"
          stroke-width="1.6" opacity="0.75"/>
  </g>
</svg>
