# chalk -- unified release workflow.
#
# Trigger: pushing a semver tag `vX.Y.Z`. ONE version, TWO artifacts, ONE
# GitHub Release:
#   * the multi-arch app image (amd64+arm64) pushed to GHCR, digest-pinned,
#     cosign keyless-signed, stamped with version/revision/created labels;
#   * the chalkctl manager binary (static, amd64+arm64) as Release assets,
#     cosign sign-blob signed, with a SHA256SUMS file.
#
# Both are stamped with the SAME version (the tag), so "the server runs chalk
# vX.Y.Z" and "chalkctl vX.Y.Z manages it" are one number. This replaces the
# old two-train split (release-chalk.yml on v*, release-chalkctl.yml on ctl-v*).
# Old ctl-v* tags remain as history; new releases use a single v* tag.
#
# The image job and the binary job run in parallel; the release job waits for
# both and publishes one Release carrying the image reference + the binaries.
#
# Second trigger: workflow_dispatch, for when GitHub drops the tag-push event
# (it did for v0.7.5 -- the ref arrived, the workflow was active and unchanged,
# and no run was ever created). Without a manual entry point the only remedy
# was deleting and re-pushing a tag that had already been released.
#
#   gh workflow run release.yml --ref vX.Y.Z
#
# **Run it at the TAG, never at a branch.** cosign's keyless certificate
# records the ref the run started from, and `chalkctl`'s verifier pins that to
# `@refs/tags/` (internal/chalkctl/verify.go). A run dispatched from main would
# sign as `@refs/heads/main` and produce an image every deployed server refuses
# to install. The guard below fails such a run before it can publish anything,
# rather than leaving that to be discovered on a server weeks later.
#
# One consequence: a tag cut BEFORE this trigger existed cannot be dispatched,
# because GitHub reads the workflow file from the ref you run it at. Those still
# need the delete-and-re-push remedy.

name: release

on:
  push:
    tags:
      - "v*"           # v1.2.3
  workflow_dispatch:   # run at a v* tag; see the header

permissions:
  contents: write      # create the Release + upload assets
  packages: write      # push to GHCR
  id-token: write      # cosign keyless (OIDC)

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/chalk

jobs:
  # ---- App image (chalkd + web bundle) ------------------------------------
  image:
    runs-on: ubuntu-latest
    # 108-1: the whole job took seven minutes when healthy and sat for two
    # hours when the emulated arm64 stage hung. A hang is now a failed job
    # `gh run rerun --failed` can pick up, not a wait for the six-hour default.
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive metadata
        id: meta
        run: |
          set -euo pipefail
          # Fail closed on a dispatch started from a branch: GITHUB_REF_NAME
          # would be `main`, which would tag the image `main`, move `:stable`
          # onto it, and sign under `@refs/heads/main` -- an identity
          # chalkctl's verifier rejects, so every server would refuse the
          # update. Cheaper to stop here than to find out there.
          case "${GITHUB_REF}" in
            refs/tags/v[0-9]*) ;;
            *) echo "::error::release must run at a v* tag, not ${GITHUB_REF}. Use: gh workflow run release.yml --ref vX.Y.Z"; exit 1 ;;
          esac
          VER="${GITHUB_REF_NAME}"                       # e.g. v1.2.3
          echo "version=${VER}"          >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:stable
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image by digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}:stable"

  # ---- chalkctl manager binary --------------------------------------------
  binaries:
    # Same tag-only rule as `image` -- see its Derive-metadata step for why.
    # Skipped rather than failed: `image` runs in parallel and already fails
    # the run with the explanation, and skipping keeps this job from spending a
    # cosign sign-blob on an identity nothing would accept.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binaries (amd64 + arm64)
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"                       # v1.2.3 (no prefix strip)
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/scuq/chalk/internal/version.Binary=chalkctl \
            -X github.com/scuq/chalk/internal/version.Version=${VER} \
            -X github.com/scuq/chalk/internal/version.Commit=${SHA} \
            -X github.com/scuq/chalk/internal/version.BuildDate=${DATE}"
          mkdir -p dist
          for arch in amd64 arm64; do
            out="dist/chalkctl_linux_${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="${LDFLAGS}" -o "${out}" ./cmd/chalkctl
            echo "built ${out}"
          done
          ( cd dist && sha256sum chalkctl_linux_* > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Smoke-test the amd64 binary
        run: |
          chmod +x dist/chalkctl_linux_amd64
          ./dist/chalkctl_linux_amd64 version

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binaries (keyless)
        run: |
          set -euo pipefail
          for f in dist/chalkctl_linux_amd64 dist/chalkctl_linux_arm64 dist/SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - name: Upload binaries for the release job
        uses: actions/upload-artifact@v4
        with:
          name: chalkctl-dist
          path: dist/*
          retention-days: 1

  # ---- Desktop app (phase 104-4) ------------------------------------------
  # The Electron shell from desktop/, one runner per OS, both CPU
  # architectures per runner (@electron/packager fetches the other arch's
  # Electron). Windows exes are Authenticode-signed with the repo's
  # self-signed certificate when the secrets exist (tools/make-signing-cert.sh);
  # macOS is unsigned/ad-hoc (no Apple developer account -- README says how to
  # open it). A desktop failure must not block the server release: the
  # release job tolerates missing desktop artifacts.
  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   runner: ubuntu-latest,  archs: "x64 arm64" }
          - { os: macos,   runner: macos-latest,   archs: "arm64 x64" }
          - { os: windows, runner: windows-latest, archs: "x64 arm64" }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install, stamp, build, test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
          npm run build
          npm test
          npm run typecheck

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            linux)   platform=linux ;;
            macos)   platform=darwin ;;
            windows) platform=win32 ;;
          esac
          for arch in ${{ matrix.archs }}; do
            node package.mjs --platform "$platform" --arch "$arch"
          done
          ls out

      # See f9's release.yml for the origin of this step. Skipped when the
      # secrets are absent, so forks still release (unsigned) desktop zips.
      - name: Sign (windows)
        if: matrix.os == 'windows' && env.WIN_SIGN_PFX_B64 != ''
        shell: pwsh
        env:
          WIN_SIGN_PFX_B64: ${{ secrets.WIN_SIGN_PFX_B64 }}
          WIN_SIGN_PFX_PASSWORD: ${{ secrets.WIN_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "chalk-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_SIGN_PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\*\signtool.exe" |
            Where-Object { $_.Directory.Name -in @("x64", "arm64") } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          $cert = Get-PfxCertificate -FilePath $pfx -Password (ConvertTo-SecureString $env:WIN_SIGN_PFX_PASSWORD -AsPlainText -Force)
          [IO.File]::WriteAllBytes("chalk-codesign.cer", $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          certutil -addstore -f Root chalk-codesign.cer | Out-Null
          certutil -addstore -f TrustedPublisher chalk-codesign.cer | Out-Null
          foreach ($exe in Get-ChildItem "out\chalk-win32-*\chalk.exe") {
            $ok = $false
            foreach ($tsa in @("http://timestamp.digicert.com", "http://timestamp.sectigo.com")) {
              & $signtool sign /f $pfx /p $env:WIN_SIGN_PFX_PASSWORD /fd SHA256 /tr $tsa /td SHA256 /d "chalk" $exe.FullName
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            }
            if (-not $ok) {
              Write-Warning "timestamping failed; signing without a timestamp"
              & $signtool sign /f $pfx /p $env:WIN_SIGN_PFX_PASSWORD /fd SHA256 /d "chalk" $exe.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
            }
            & $signtool verify /pa /v $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($exe.FullName)" }
            Copy-Item chalk-codesign.cer $exe.Directory.FullName
          }
          Remove-Item $pfx -Force
          "SHA-256 fingerprint: " + (($cert.GetCertHash("SHA256") | ForEach-Object { $_.ToString("X2") }) -join ":")

      - name: Archive (linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist-desktop
          for arch in ${{ matrix.archs }}; do
            tar czf "../dist-desktop/chalk-desktop-$V-linux-$arch.tar.gz" -C out "chalk-linux-$arch"
          done

      - name: Archive (macos)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist-desktop
          for arch in ${{ matrix.archs }}; do
            # Ad-hoc signature: no Apple identity, but a valid seal, which is
            # what Apple Silicon requires to run at all and what the
            # self-updater's bundle swap (105-3) preserves by never touching
            # the bundle's contents.
            codesign --force --deep --sign - "out/chalk-darwin-$arch/chalk.app"
            codesign --verify --deep --strict "out/chalk-darwin-$arch/chalk.app"
            ditto -c -k --keepParent "out/chalk-darwin-$arch/chalk.app" "../dist-desktop/chalk-desktop-$V-macos-$arch.zip"
          done

      - name: Archive (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $V = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force ../dist-desktop | Out-Null
          foreach ($arch in "${{ matrix.archs }}".Split(" ")) {
            Compress-Archive -Path "out/chalk-win32-$arch/*" -DestinationPath "../dist-desktop/chalk-desktop-$V-windows-$arch.zip"
          }

      - name: Upload desktop archives for the release job
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist-desktop/*
          retention-days: 1
          if-no-files-found: error

  # ---- One Release carrying all of it -------------------------------------
  release:
    needs: [image, binaries, desktop]
    # The desktop job may fail or be skipped without holding the server
    # release hostage; image and binaries must both have succeeded.
    if: always() && needs.image.result == 'success' && needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download chalkctl binaries
        uses: actions/download-artifact@v4
        with:
          name: chalkctl-dist
          path: dist

      - name: Download desktop archives (tolerated when absent)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/desktop
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # A separate sums file for the desktop archives, keyless-signed like the
      # chalkctl one. Phase 105's self-updater is what will verify it.
      - name: Sum and sign desktop archives
        run: |
          set -euo pipefail
          if ! ls dist/desktop/chalk-desktop-* >/dev/null 2>&1; then
            echo "no desktop archives in this release"; exit 0
          fi
          ( cd dist/desktop && sha256sum chalk-desktop-* > SHA256SUMS.desktop )
          cat dist/desktop/SHA256SUMS.desktop
          cosign sign-blob --yes \
            --output-signature dist/desktop/SHA256SUMS.desktop.sig \
            --output-certificate dist/desktop/SHA256SUMS.desktop.pem \
            dist/desktop/SHA256SUMS.desktop

      # 105-1: the signature the desktop app itself verifies, Ed25519 with
      # the key from tools/make-release-key.sh, pinned in
      # desktop/src/selfupdate/key.ts. Raw 64-byte signature over the sums
      # file's exact bytes. Skipped when the secret is absent (forks, and this
      # repo until the key is made): the app then keeps announcing without
      # installing. A second secret, RELEASE_SIGN_KEY_B64_NEXT, signs a
      # ".ed25519.next" copy during a key rotation.
      - name: Sign desktop sums for the self-updater
        if: env.RELEASE_SIGN_KEY_B64 != ''
        env:
          RELEASE_SIGN_KEY_B64: ${{ secrets.RELEASE_SIGN_KEY_B64 }}
          RELEASE_SIGN_KEY_B64_NEXT: ${{ secrets.RELEASE_SIGN_KEY_B64_NEXT }}
        run: |
          set -euo pipefail
          [ -f dist/desktop/SHA256SUMS.desktop ] || { echo "no desktop sums to sign"; exit 0; }
          sign() {
            key="$(mktemp)"
            printf '%s' "$1" | base64 -d > "$key"
            openssl pkeyutl -sign -inkey "$key" -rawin \
              -in dist/desktop/SHA256SUMS.desktop -out "dist/desktop/SHA256SUMS.desktop.$2"
            openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | xxd -p | tr -d '\n' > "$key.hex"
            echo "signed with key $(cat "$key.hex") -> SHA256SUMS.desktop.$2"
            rm -f "$key" "$key.hex"
          }
          sign "$RELEASE_SIGN_KEY_B64" ed25519
          if [ -n "${RELEASE_SIGN_KEY_B64_NEXT:-}" ]; then
            sign "$RELEASE_SIGN_KEY_B64_NEXT" ed25519.next
          fi

      - name: Create GitHub Release (image + binaries + desktop)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/chalkctl_linux_amd64
            dist/chalkctl_linux_arm64
            dist/SHA256SUMS
            dist/*.sig
            dist/*.pem
            dist/desktop/*
          body: |
            **chalk ${{ needs.image.outputs.version }}** — app image + chalkctl manager + desktop app, one version.

            **Desktop app** (`chalk-desktop-<version>-<os>-<arch>`): Windows and Linux x64/arm64, macOS Apple Silicon and Intel. Unpack and run `chalk` — it asks for your server on first start. Windows warns about an unknown publisher (self-signed; `chalk-codesign.cer` is in the zip), macOS needs right-click → Open the first time. Details in the README under "Desktop app". Sums in `SHA256SUMS.desktop`, keyless-signed like the rest.

            **App image** (chalkd + web bundle):
            `${{ env.IMAGE }}:${{ needs.image.outputs.version }}`
            digest `${{ needs.image.outputs.digest }}`

            Deploy / update on the server:
            ```
            sudo chalkctl update --version ${{ needs.image.outputs.version }}
            ```

            **chalkctl manager binary** (static, linux/amd64 + linux/arm64):
            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/chalkctl_linux_amd64 -o chalkctl
            chmod +x chalkctl && sudo mv -f chalkctl /usr/local/bin/chalkctl
            hash -r && chalkctl version
            ```

            Both artifacts are cosign keyless-signed. Verify the image:
            ```
            cosign verify ${{ env.IMAGE }}:${{ needs.image.outputs.version }} \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```
            Verify a binary:
            ```
            cosign verify-blob chalkctl_linux_amd64 \
              --signature chalkctl_linux_amd64.sig \
              --certificate chalkctl_linux_amd64.pem \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```
